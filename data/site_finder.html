<!-- Site finder chat widget by scmlearn21-bit (from their commit 8d4ea7c). Added to the home page by findings_page.py when data/match.js exists. -->
<style>
  #chat-toggle{position:fixed;right:20px;bottom:20px;z-index:1000;border:0;border-radius:999px;padding:12px 18px;background:#4a8cf0;color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  #chat-panel{position:fixed;right:20px;bottom:80px;z-index:1000;width:320px;max-width:calc(100vw - 40px);height:420px;max-height:calc(100vh - 110px);display:none;flex-direction:column;background:#1a2540;color:#eef2ff;border:1px solid #34476e;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.5);font:14px/1.4 system-ui,sans-serif;overflow:hidden}
  #chat-panel.open{display:flex}
  #chat-head{padding:10px 14px;background:#22305a;font-weight:600}
  #chat-log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .msg{padding:8px 11px;border-radius:10px;max-width:85%}
  .msg.bot{background:#2b3a66;align-self:flex-start}
  .msg.me{background:#4a8cf0;color:#fff;align-self:flex-end}
  .msg a{color:#9cc4ff;font-weight:600}
  #chat-form{display:flex;gap:6px;padding:10px;border-top:1px solid #34476e}
  #chat-input{flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid #34476e;background:#111a30;color:#eef2ff}
  #chat-send{border:0;border-radius:8px;padding:8px 12px;background:#4a8cf0;color:#fff;font-weight:600;cursor:pointer}
</style>

<button id="chat-toggle" type="button">💬 Find a site</button>
<div id="chat-panel">
  <div id="chat-head">Site finder</div>
  <div id="chat-log"></div>
  <form id="chat-form" autocomplete="off">
    <input id="chat-input" placeholder="e.g. hot and flat">
    <button id="chat-send" type="submit">Send</button>
  </form>
</div>

<script type="module">
  import { findMatches } from "./match.js";

  // site name -> its page in the sites/ folder
  const pages = {
    "Harrat Khaybar and Umm Jirsan lava tube, Saudi Arabia": "harrat-khaybar-and-umm-jirsan-lava-tube-saudi-arabia",
    "Kamil Crater, Egypt": "kamil-crater-egypt",
    "Lonar Crater, India": "lonar-crater-india",
    "East Antarctic Plateau cold spots": "east-antarctic-plateau-cold-spots",
    "Lut Desert (Dasht-e Lut), Iran": "lut-desert-dasht-e-lut-iran",
    "Kharga yardangs (Western Desert), Egypt": "kharga-yardangs-western-desert-egypt",
    "Western Qaidam Basin, China": "western-qaidam-basin-china",
    "Bodélé Depression, Chad": "bodele-depression-chad",
    "Dallol, Danakil Depression, Ethiopia": "dallol-danakil-depression-ethiopia",
    "Río Tinto (Peña de Hierro), Spain": "rio-tinto-pena-de-hierro-spain",
    "Atacama Desert (Yungay), Chile": "atacama-desert-yungay-chile",
    "Haughton Crater, Devon Island, Canada": "haughton-crater-devon-island-canada",
  };
  const link = (m) => `<a href="sites/${pages[m.name]}.html">${m.name}</a>`;

  const panel = document.getElementById("chat-panel");
  const log = document.getElementById("chat-log");
  const input = document.getElementById("chat-input");

  function add(who, html) {
    const d = document.createElement("div");
    d.className = "msg " + who;
    d.innerHTML = html;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  add("bot", "Hi! Tell me what conditions you want, like <em>hot and flat</em> or <em>cold, low dust</em>, and I'll point you to the best site.");

  document.getElementById("chat-toggle").onclick = () => {
    panel.classList.toggle("open");
    if (panel.classList.contains("open")) input.focus();
  };

  document.getElementById("chat-form").onsubmit = (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    add("me", text.replace(/</g, "&lt;"));
    const [best, second] = findMatches(text, 2);
    if (!best || best.score === 0) {
      add("bot", "I didn't catch a condition there. Try words like hot, cold, flat, steep, dusty, low dust, high sun or low sun.");
      return;
    }
    add("bot", `Best match: ${link(best)} (slope ${best.slope}°, max ${best.maxTemp} °C, dust ${best.dust}).` +
      (second ? `<br>Runner-up: ${link(second)}.` : ""));
  };
</script>
